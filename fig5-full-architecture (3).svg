<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="788" viewBox="0 0 1332 788">
<style>
  .n{fill:#FFFFFF;stroke:#CFD7DE;stroke-width:1.5}
  .n-sunk{fill:#E9EDF0;stroke:#CFD7DE;stroke-width:1.5}
  .n-det{fill:#E4F2E5;stroke:#15701F;stroke-width:2.5}
  .n-llm{fill:#F6EADF;stroke:#9A5116;stroke-width:1.5;stroke-dasharray:6 4}
  .n-llm-s{fill:#F6EADF;stroke:#9A5116;stroke-width:2}
  .n-allow{fill:#E4F2E5;stroke:#15701F;stroke-width:2}
  .n-deny{fill:#F6E4E6;stroke:#8C2F39;stroke-width:2}
  .zone{fill:none;stroke:#CFD7DE;stroke-width:1;stroke-dasharray:4 4}
  .zone-ext{fill:none;stroke:#9A5116;stroke-width:1;stroke-dasharray:4 4}
  .life{stroke:#CFD7DE;stroke-width:1;stroke-dasharray:3 4}
  .bnd{stroke:#4B5763;stroke-width:1.25;stroke-dasharray:7 5}
  .t{fill:#141A20;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:600;font-size:12.5px}
  .t-lg{fill:#141A20;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px}
  .ts{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px}
  .tk{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.07em}
  .zlab{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10px;letter-spacing:.09em}
  .tl{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
  .tl-em{fill:#141A20;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;font-weight:500;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
  .a{stroke:#4B5763;stroke-width:1.5;fill:none;marker-end:url(#ah)}
  .a-llm{stroke:#9A5116;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#ah-llm)}
  .a-det{stroke:#15701F;stroke-width:2.5;fill:none;marker-end:url(#ah-det)}
  .a-allow{stroke:#15701F;stroke-width:2;fill:none;marker-end:url(#ah-allow)}
  .a-deny{stroke:#8C2F39;stroke-width:2;fill:none;marker-end:url(#ah-deny)}
  .a-oob{stroke:#4B5763;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ah)}
  .bg{fill:#15701F} .bg-llm{fill:#9A5116}
  .bn{fill:#FFFFFF;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:700;font-size:9.5px}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5763"/></marker>
  <marker id="ah-llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A5116"/></marker>
  <marker id="ah-det" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15701F"/></marker>
  <marker id="ah-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15701F"/></marker>
  <marker id="ah-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C2F39"/></marker>
</defs>
<rect x="0" y="0" width="1332" height="788" fill="#FFFFFF"/>
<g transform="translate(16,16)">

        <!-- ===== the model ===== -->
        <rect class="n-llm" x="976" y="16" width="296" height="46" rx="2"/>
        <text class="t" x="1124" y="37" text-anchor="middle">Azure OpenAI</text>
        <text class="tk" x="1124" y="54" text-anchor="middle">MANAGED SERVICE · NON-DETERMINISTIC</text>

        <!-- ===== browser ===== -->
        <rect class="zone" x="16" y="96" width="624" height="74" rx="2"/>
        <text class="zlab" x="28" y="114">BROWSER</text>
        <rect class="n" x="28" y="122" width="260" height="40" rx="2"/>
        <text class="t" x="158" y="147" text-anchor="middle">Member — browser chat UI</text>
        <text class="tl" x="308" y="147">verified by passcode at the start of the session</text>

        <line class="a-llm" x1="1100" y1="208" x2="1100" y2="68"/>
        <circle class="bg-llm" cx="1100" cy="130" r="9.5"/>
        <text class="bn" x="1100" y="133.5" text-anchor="middle">2</text>
        <line class="a-llm" x1="1148" y1="68" x2="1148" y2="208"/>
        <circle class="bg-llm" cx="1148" cy="158" r="9.5"/>
        <text class="bn" x="1148" y="161.5" text-anchor="middle">3</text>
        <text class="tl" x="660" y="126">2 · prompt: conversation, verified patients, tool schemas</text>
        <text class="tl-em" x="660" y="154">3 · tool proposal returned</text>

        <!-- ===== application backend ===== -->
        <rect class="zone" x="16" y="180" width="1268" height="316" rx="2"/>
        <text class="zlab" x="28" y="198">APPLICATION BACKEND</text>
        <text class="zlab" x="640" y="198" text-anchor="end">KUBERNETES</text>

        <rect class="n" x="28" y="210" width="296" height="56" rx="2"/>
        <text class="t" x="176" y="234" text-anchor="middle">Socket.IO gateway</text>
        <text class="ts" x="176" y="251" text-anchor="middle">binds session_id to the thread</text>

        <rect class="n" x="344" y="210" width="296" height="56" rx="2"/>
        <text class="t" x="492" y="234" text-anchor="middle">Agent orchestrator</text>
        <text class="ts" x="492" y="251" text-anchor="middle">LangGraph state graph</text>

        <rect class="n" x="660" y="210" width="296" height="56" rx="2"/>
        <text class="t" x="808" y="234" text-anchor="middle">Context builder</text>
        <text class="ts" x="808" y="251" text-anchor="middle">decides what reaches the model</text>

        <rect class="n" x="976" y="210" width="296" height="56" rx="2"/>
        <text class="t" x="1124" y="234" text-anchor="middle">LLM client</text>
        <text class="ts" x="1124" y="251" text-anchor="middle">Azure OpenAI SDK</text>

        <line class="a" x1="324" y1="238" x2="344" y2="238"/>
        <line class="a" x1="640" y1="238" x2="660" y2="238"/>
        <line class="a" x1="956" y1="238" x2="976" y2="238"/>

        <line class="a" x1="284" y1="162" x2="284" y2="208"/>
        <text class="tl" x="296" y="194">1 · WSS</text>

        <polyline class="a-llm" points="1124,266 1124,280 176,280 176,310"/>
        <text class="tl-em" x="650" y="296" text-anchor="middle">4 · the proposal is handed to application code</text>

        <rect class="n" x="28" y="312" width="296" height="70" rx="2"/>
        <text class="t" x="176" y="338" text-anchor="middle">Tool dispatcher</text>
        <text class="ts" x="176" y="358" text-anchor="middle">executes tool proposals</text>

        <rect class="n-det" x="344" y="312" width="296" height="70" rx="2"/>
        <text class="t" x="492" y="338" text-anchor="middle">Authorization validator</text>
        <text class="ts" x="492" y="358" text-anchor="middle">patientPersonId in verified_patients ?</text>

        <rect class="n" x="660" y="312" width="296" height="70" rx="2"/>
        <text class="t" x="808" y="338" text-anchor="middle">Session state store</text>
        <text class="ts" x="808" y="358" text-anchor="middle">verified_patients · activeEnrollments</text>

        <rect class="n" x="976" y="312" width="296" height="70" rx="2"/>
        <text class="t" x="1124" y="338" text-anchor="middle">MCP client</text>
        <text class="ts" x="1124" y="358" text-anchor="middle">obtains the service token</text>

        <line class="a" x1="324" y1="350" x2="344" y2="350"/>
        <circle class="bg" cx="334" cy="324" r="9.5"/>
        <text class="bn" x="334" y="327.5" text-anchor="middle">5</text>
        <line class="a-det" x1="640" y1="350" x2="660" y2="350"/>
        <circle class="bg" cx="650" cy="324" r="9.5"/>
        <text class="bn" x="650" y="327.5" text-anchor="middle">6</text>

        <!-- the fork: allow to the right, deny to the left -->
        <polyline class="a-det" points="560,382 560,398 1124,398 1124,384"/>
        <text class="tl-em" x="842" y="414" text-anchor="middle">7 · ALLOW — ids resolved from session state, not from the model</text>

        <polyline class="a-deny" points="424,382 424,416 230,416 230,430"/>
        <text class="tl-em" x="300" y="408" text-anchor="middle">DENY</text>
        <rect class="n-deny" x="28" y="430" width="404" height="52" rx="2"/>
        <text class="t" x="230" y="452" text-anchor="middle">DENIED — Benefits MCP is not called</text>
        <text class="ts" x="230" y="470" text-anchor="middle">requested id vs the verified set — mismatch logged</text>

        <!-- ===== mcp servers ===== -->
        <polyline class="a" points="1160,384 1160,502 334,502 334,532"/>
        <line class="a" x1="1240" y1="384" x2="1240" y2="532"/>

        <rect class="zone" x="16" y="508" width="1268" height="104" rx="2"/>
        <text class="zlab" x="28" y="526">MCP SERVERS</text>
        <text class="tl" x="600" y="526" text-anchor="middle">8 · MCP over HTTP — service token attached</text>

        <rect class="n" x="28" y="534" width="612" height="70" rx="2"/>
        <text class="t" x="334" y="556" text-anchor="middle">Enrollment MCP server</text>
        <text class="ts" x="334" y="574" text-anchor="middle">identity proofing, summarized:</text>
        <text class="ts" x="334" y="591" text-anchor="middle">get_contact_info → send_otp → validate_otp → get_enrollments</text>

        <rect class="n" x="660" y="534" width="612" height="70" rx="2"/>
        <text class="t" x="966" y="556" text-anchor="middle">Benefits MCP server</text>
        <text class="ts" x="966" y="574" text-anchor="middle">member benefit and coverage data:</text>
        <text class="ts" x="966" y="591" text-anchor="middle">get_member_benefits</text>

        <!-- ===== backend services ===== -->
        <rect class="zone" x="16" y="624" width="1268" height="116" rx="2"/>
        <text class="zlab" x="28" y="642">BACKEND SERVICES</text>
        <text class="tl" x="700" y="642">9 · REST — the same token, application identity only</text>

        <rect class="n" x="28" y="652" width="396" height="62" rx="2"/>
        <text class="t" x="226" y="678" text-anchor="middle">Enrollment service</text>
        <text class="ts" x="226" y="695" text-anchor="middle">member and patient records</text>

        <rect class="n" x="452" y="652" width="396" height="62" rx="2"/>
        <text class="t" x="650" y="678" text-anchor="middle">OTP / notification service</text>
        <text class="ts" x="650" y="695" text-anchor="middle">issues and delivers passcodes</text>

        <rect class="n" x="876" y="652" width="396" height="62" rx="2"/>
        <text class="t" x="1074" y="678" text-anchor="middle">Benefits service</text>
        <text class="ts" x="1074" y="695" text-anchor="middle">coverage and benefit detail</text>

        <line class="a" x1="226" y1="604" x2="226" y2="650"/>
        <polyline class="a" points="600,604 600,628 650,628 650,650"/>
        <line class="a" x1="1074" y1="604" x2="1074" y2="650"/>
      </g>
</svg>