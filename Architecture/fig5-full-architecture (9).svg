<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="956" viewBox="0 0 1332 956">
<style>
  .n{fill:#FFFFFF;stroke:#CFD7DE;stroke-width:1.5}
  .n-sunk{fill:#E9EDF0;stroke:#CFD7DE;stroke-width:1.5}
  .n-det{fill:#E4F2E5;stroke:#15701F;stroke-width:2.5}
  .n-llm{fill:#F6EADF;stroke:#9A5116;stroke-width:1.5;stroke-dasharray:6 4}
  .n-llm-s{fill:#F6EADF;stroke:#9A5116;stroke-width:2}
  .n-allow{fill:#E4F2E5;stroke:#15701F;stroke-width:2}
  .n-deny{fill:#F6E4E6;stroke:#8C2F39;stroke-width:2}
  .zone{fill:none;stroke:#CFD7DE;stroke-width:1;stroke-dasharray:4 4}
  .zone-ext{fill:none;stroke:#9A5116;stroke-width:1;stroke-dasharray:4 4}
  .life{stroke:#CFD7DE;stroke-width:1;stroke-dasharray:3 4}
  .bnd{stroke:#4B5763;stroke-width:1.25;stroke-dasharray:7 5}
  .t{fill:#141A20;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:600;font-size:12.5px}
  .t-lg{fill:#141A20;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px}
  .ts{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px}
  .tk{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.07em}
  .zlab{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10px;letter-spacing:.09em}
  .tl{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
  .tl-em{fill:#141A20;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;font-weight:500;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
  .a{stroke:#4B5763;stroke-width:1.5;fill:none;marker-end:url(#ah)}
  .a-llm{stroke:#9A5116;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#ah-llm)}
  .a-det{stroke:#15701F;stroke-width:2.5;fill:none;marker-end:url(#ah-det)}
  .a-allow{stroke:#15701F;stroke-width:2;fill:none;marker-end:url(#ah-allow)}
  .a-deny{stroke:#8C2F39;stroke-width:2;fill:none;marker-end:url(#ah-deny)}
  .a-oob{stroke:#4B5763;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ah)}
  .bg{fill:#15701F} .bg-llm{fill:#9A5116}
  .bn{fill:#FFFFFF;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:700;font-size:9.5px}
  .tw{fill:#8C2F39;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.07em}
  .tg{fill:#15701F;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.07em}
  .ref{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9px;opacity:.85}
  .feed{stroke:#4B5763;stroke-width:1.5;fill:none}
  .runtime{fill:#E9EDF0;stroke:#4B5763;stroke-width:1.25}
  .n-warn{fill:#F6EADF;stroke:#9A5116;stroke-width:2.5}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5763"/></marker>
  <marker id="ah-llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A5116"/></marker>
  <marker id="ah-det" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15701F"/></marker>
  <marker id="ah-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15701F"/></marker>
  <marker id="ah-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C2F39"/></marker>
</defs>
<rect x="0" y="0" width="1332" height="956" fill="#FFFFFF"/>
<g transform="translate(16,16)">

        <rect class="n-llm" x="976" y="16" width="296" height="46" rx="2"/>
        <text class="t" x="1124" y="37" text-anchor="middle">Azure OpenAI</text>
        <text class="tk" x="1124" y="54" text-anchor="middle">MANAGED SERVICE · NON-DETERMINISTIC</text>

        <rect class="zone" x="16" y="96" width="356" height="66" rx="2"/>
        <text class="zlab" x="28" y="114">MEMBER</text>
        <rect class="n" x="28" y="104" width="300" height="42" rx="2"/>
        <text class="t" x="178" y="130" text-anchor="middle">Member (web browser)</text>

        <line class="a-llm" x1="1060" y1="376" x2="1060" y2="68"/>
        <circle class="bg-llm" cx="1060" cy="112" r="9.5"/>
        <text class="bn" x="1060" y="115.5" text-anchor="middle">2</text>
        <line class="a-llm" x1="1108" y1="68" x2="1108" y2="376"/>
        <circle class="bg-llm" cx="1108" cy="152" r="9.5"/>
        <text class="bn" x="1108" y="155.5" text-anchor="middle">3</text>
        <text class="tl" x="660" y="112">2 · conversation, verified member and enrollment</text>
        <text class="tl" x="660" y="128">context, bound tool schemas — no credentials</text>
        <text class="tl-em" x="660" y="156">3 · the model returns a tool choice and arguments</text>

        <rect class="zone" x="16" y="176" width="1268" height="522" rx="2"/>
        <text class="zlab" x="1040" y="194" text-anchor="end">CHATBOT ORCHESTRATOR SERVICE</text>

        <rect class="n" x="28" y="206" width="252" height="90" rx="2"/>
        <text class="t" x="154" y="232" text-anchor="middle">Session history</text>
        <text class="t" x="154" y="248" text-anchor="middle">endpoint</text>
        <text class="ts" x="154" y="270" text-anchor="middle">returns conversation</text>
        <text class="ts" x="154" y="286" text-anchor="middle">state by session id</text>

        <line class="a" x1="154" y1="296" x2="154" y2="324"/>

        <rect class="n" x="28" y="326" width="252" height="274" rx="2"/>
        <text class="t" x="154" y="350" text-anchor="middle">Session state</text>
        <text class="ts" x="154" y="368" text-anchor="middle">held in EMCache</text>
        <text class="tw" x="154" y="394" text-anchor="middle">PLAIN SERIALIZED STATE</text>
        <text class="ts" x="154" y="418" text-anchor="middle">conversation, tool inputs</text>
        <text class="ts" x="154" y="434" text-anchor="middle">and outputs, verified</text>
        <text class="ts" x="154" y="450" text-anchor="middle">member and patient set</text>
        <text class="ts" x="154" y="480" text-anchor="middle">written by validation</text>
        <text class="ts" x="154" y="496" text-anchor="middle">on success only</text>
        <text class="ts" x="154" y="526" text-anchor="middle">read by the benefit</text>
        <text class="ts" x="154" y="542" text-anchor="middle">validator</text>

        <rect class="n" x="300" y="206" width="600" height="50" rx="2"/>
        <text class="t" x="600" y="228" text-anchor="middle">Chat API</text>
        <text class="ts" x="600" y="246" text-anchor="middle">HTTPS POST, NDJSON streaming response</text>

        <line class="a" x1="154" y1="146" x2="154" y2="204"/>
        <polyline class="a" points="300,146 300,170 546,170 546,204"/>
        <text class="tl" x="558" y="190">1 · HTTPS</text>

        <rect class="runtime" x="300" y="276" width="972" height="406" rx="2"/>
        <text class="zlab" x="316" y="296">LANGGRAPH RUNTIME — ONE PROCESS, NO INTERNAL BOUNDARY</text>

        <rect class="n" x="316" y="306" width="940" height="58" rx="2"/>
        <text class="t" x="786" y="326" text-anchor="middle">Session router</text>
        <text class="ts" x="786" y="344" text-anchor="middle">is a verified member already in session state?</text>
        <text class="tk" x="786" y="358" text-anchor="middle">VALIDATION RUNS FIRST; THE ORIGINAL REQUEST RESUMES ONCE VERIFIED STATE IS WRITTEN</text>

        <line class="a" x1="546" y1="256" x2="546" y2="304"/>
        <line class="a" x1="546" y1="364" x2="546" y2="376"/>
        <line class="a" x1="1026" y1="364" x2="1026" y2="376"/>

        <rect class="n" x="316" y="378" width="460" height="80" rx="2"/>
        <text class="t" x="546" y="400" text-anchor="middle">Customer validation flow</text>
        <text class="tk" x="546" y="418" text-anchor="middle">NO — RUNS BEFORE THE REQUEST IS SERVED</text>
        <text class="ts" x="546" y="436" text-anchor="middle">the model drives contact choice</text>
        <text class="ts" x="546" y="452" text-anchor="middle">and passcode entry</text>

        <rect class="n" x="796" y="378" width="460" height="80" rx="2"/>
        <text class="t" x="1026" y="400" text-anchor="middle">Member flow</text>
        <text class="tk" x="1026" y="418" text-anchor="middle">YES — THE REQUEST IS SERVED</text>
        <text class="ts" x="1026" y="436" text-anchor="middle">context assembly and model call</text>
        <text class="ts" x="1026" y="452" text-anchor="middle">the model proposes a capability and a patient</text>

        <line class="a" x1="546" y1="458" x2="546" y2="474"/>
        <line class="a" x1="1026" y1="458" x2="1026" y2="474"/>

        <rect class="n" x="316" y="476" width="940" height="42" rx="2"/>
        <text class="t" x="786" y="494" text-anchor="middle">Tool dispatch</text>
        <text class="tk" x="786" y="510" text-anchor="middle">4 · EACH CAPABILITY ENFORCES ITS OWN SCOPE — THERE IS NO CENTRAL GATE HERE</text>

        <line class="a" x1="546" y1="518" x2="546" y2="530"/>
        <line class="a" x1="1026" y1="518" x2="1026" y2="530"/>

        <rect class="n" x="316" y="532" width="460" height="76" rx="2"/>
        <text class="t" x="546" y="552" text-anchor="middle">Enrollment / one-time passcode</text>
        <text class="tk" x="546" y="570" text-anchor="middle">INTENTIONAL PRE-VERIFICATION FLOW — NO VERIFIED-PATIENT VALIDATOR</text>
        <text class="ts" x="546" y="588" text-anchor="middle">get_contact_info → send_otp → validate_otp</text>
        <text class="ts" x="546" y="602" text-anchor="middle">verified state written only on VERIFICATION_SUCCESS</text>

        <rect class="n-det" x="796" y="532" width="460" height="76" rx="2"/>
        <text class="t" x="1026" y="552" text-anchor="middle">Benefit inquiry</text>
        <text class="tg" x="1026" y="570" text-anchor="middle">MEMBER SCOPE ENFORCED — VERIFIED-PATIENT VALIDATOR</text>
        <text class="ts" x="1026" y="588" text-anchor="middle">reads the verified set from session state</text>
        <text class="ts" x="1026" y="602" text-anchor="middle">no call for a patient that is not in it</text>

        <line class="a-det" x1="316" y1="566" x2="284" y2="566"/>
        <circle class="bg" cx="292" cy="544" r="9.5"/>
        <text class="bn" x="292" y="547.5" text-anchor="middle">5</text>

        <polyline class="a" points="546,608 546,618 1026,618 1026,624"/>
        <line class="feed" x1="1026" y1="608" x2="1026" y2="618"/>

        <rect class="n" x="316" y="626" width="460" height="48" rx="2"/>
        <text class="t" x="546" y="646" text-anchor="middle">Service token</text>
        <text class="ts" x="546" y="664" text-anchor="middle">service OAuth token and context headers</text>

        <rect class="n" x="796" y="626" width="460" height="48" rx="2"/>
        <text class="t" x="1026" y="646" text-anchor="middle">MCP client</text>
        <text class="ts" x="1026" y="664" text-anchor="middle">adds the token, session id and context</text>

        <line class="a" x1="776" y1="650" x2="794" y2="650"/>

        <polyline class="a" points="960,682 960,706 334,706 334,738"/>
        <line class="a" x1="1150" y1="682" x2="1150" y2="738"/>

        <rect class="zone" x="16" y="714" width="1268" height="88" rx="2"/>
        <text class="zlab" x="28" y="732">MCP SERVICES</text>
        <text class="tl" x="700" y="732">6 · MCP over HTTP with the service token and context headers</text>

        <rect class="n" x="28" y="740" width="612" height="58" rx="2"/>
        <text class="t" x="334" y="760" text-anchor="middle">Enrollment MCP service</text>
        <text class="ts" x="334" y="776" text-anchor="middle">member and contact lookups, passcode issue and check</text>
        <text class="ts" x="334" y="792" text-anchor="middle">returns a verification outcome, or no data</text>

        <rect class="n" x="660" y="740" width="612" height="58" rx="2"/>
        <text class="t" x="966" y="760" text-anchor="middle">Benefits MCP service</text>
        <text class="tw" x="966" y="776" text-anchor="middle">STATELESS — NO SESSION TO MEMBER COMPARISON</text>
        <text class="ts" x="966" y="792" text-anchor="middle">validates required fields and serves what it is asked for</text>

        <rect class="zone" x="16" y="818" width="1268" height="90" rx="2"/>
        <text class="zlab" x="28" y="836">BACKEND SERVICES</text>
        <text class="tl" x="700" y="836">7 · REST with the same service token</text>

        <rect class="n" x="28" y="844" width="396" height="54" rx="2"/>
        <text class="t" x="226" y="868" text-anchor="middle">Enrollment service</text>
        <text class="ts" x="226" y="886" text-anchor="middle">member and patient records</text>

        <rect class="n" x="452" y="844" width="396" height="54" rx="2"/>
        <text class="t" x="650" y="868" text-anchor="middle">Passcode delivery</text>
        <text class="ts" x="650" y="886" text-anchor="middle">issues and sends passcodes</text>

        <rect class="n" x="876" y="844" width="396" height="54" rx="2"/>
        <text class="t" x="1074" y="868" text-anchor="middle">Benefits service</text>
        <text class="ts" x="1074" y="886" text-anchor="middle">coverage and benefit detail</text>

        <line class="a" x1="226" y1="798" x2="226" y2="842"/>
        <polyline class="a" points="600,798 600,822 650,822 650,842"/>
        <line class="a" x1="1074" y1="798" x2="1074" y2="842"/>
      </g>
</svg>