  var fl=[['All','All'],['ai','AI fields not reviewed'],['wd','Working draft'],['chg','Source changed'],['ready','Ready for Prod']].map(function(x){return '<button class="fchip'+(S.fFlag===x[0]?' on':'')+'" data-act="fFlag" data-arg="'+x[0]+'">'+x[1]+'</button>';}).join('');
  var st=['All','Draft','In review','Published','Archived'].map(function(x){return '<button class="fchip'+(S.fS===x?' on':'')+'" data-act="fS" data-arg="'+x+'">'+x+'</button>';}).join('');
  var body=rows.map(function(r){
    var sr=search(r),ai=aiDone(r);
    return '<tr class="click" data-act="open" data-arg="'+r.id+'"><td><div style="font-weight:600">'+e(r.name)+'</div><div class="mono muted" style="font-size:12px">'+e(r.path)+' · '+r.files+' SAS file'+(r.files>1?'s':'')+'</div></td>'+
    '<td>'+stChip(r.status)+'<div style="margin-top:4px">'+flags(r)+'</div></td><td>'+e(r.platform)+'</td>'+
    '<td>'+(r.ver?'UAT v'+r.ver:'—')+'<div class="muted" style="font-size:12px">Prod '+(r.prodVer?'v'+r.prodVer:'—')+'</div></td>'+
    '<td>'+(r.status==='Archived'?'—':'<span class="'+(ai===AIK.length?'ok':'warn')+'">'+ai+' / '+AIK.length+'</span>')+'</td>'+
    '<td>'+r.modified+'<div class="muted" style="font-size:12px">'+r.by+'</div></td><td><span class="'+sr[1]+'" style="font-size:13px">'+sr[0]+'</span></td></tr>';
  }).join('');

  '<div class="grid4">'+tiles+'</div>'+
  '<div class="card pad row"><label style="flex:1 1 260px"><span style="position:absolute;left:-9999px">Search reports</span><input class="inp" data-field="q" value="'+e(S.q)+'" placeholder="Search by report, path, keyword or description"></label>'+
  '<div class="row" style="gap:6px"><span class="lbl">Status</span>'+st+'</div><div class="row" style="gap:6px"><span class="lbl">Needs attention</span>'+fl+'</div>'+
  '<div class="row" style="gap:6px"><span class="lbl">Sort</span><select class="inp" data-field="sort"><option value="mod"'+(S.sort==='mod'?' selected':'')+'>Last modified</option><option value="name"'+(S.sort==='name'?' selected':'')+'>Name A–Z</option></select></div></div>'+
  ((S.fS!=='All'||S.fFlag!=='All'||q)?'<div class="banner b-warn row"><span style="flex:1">Showing '+rows.length+' of '+S.reports.length+' reports (filtered)</span>'+B('Clear filters','btn-sm','clear')+'</div>':'')+
  '<div class="card scroll"><table class="tbl" style="min-width:1050px"><thead><tr><th>Report / source</th><th>Status</th><th>Platform</th><th>Version</th><th>AI fields reviewed</th><th>Last modified</th><th>Report Concierge</th></tr></thead><tbody>'+body+'</tbody></table>'+
  (rows.length?'':'<div class="muted" style="padding:28px;text-align:center">No reports match.</div>')+
  '<div class="row" style="justify-content:space-between;padding:10px 16px;font-size:13px"><span class="muted">'+rows.length+' reports · 25 per page</span><div class="row" style="gap:6px"><button class="btn btn-sm" disabled>Previous</button><button class="btn btn-sm" disabled>Next</button></div></div></div></div>';
}

/* ---------- load from source ---------- */
function srcState(name){
  var r=S.reports.find(function(x){return x.folder===name&&x.status!=='Archived';});
  if(!r)return {t:'New',c:'c-arch',r:null};
  if(r.status==='Published'&&r.srcChanged)return {t:'Published · source changed',c:'c-chg',r:r};
  return {t:r.status==='Published'?'Published v'+r.ver:(r.status+' exists'),c:r.status==='Published'?'c-pub':'c-draft',r:r};
}
function vLoad(){
  var q=S.srcQ.trim().toLowerCase();
  var list=S.sources.filter(function(s){var st=srcState(s.name);return (!q||s.name.toLowerCase().indexOf(q)>=0)&&(S.incl||!st.r||st.r.srcChanged);});
  var sel=Object.keys(S.srcSel).filter(function(k){return S.srcSel[k];});
  var rows=list.map(function(s){
    var st=srcState(s.name),on=!!S.srcSel[s.name];
    return '<label class="src"><input type="checkbox" data-chk="src" data-arg="'+e(s.name)+'"'+(on?' checked':'')+'><div style="flex:1 1 260px"><div style="font-weight:600">'+e(s.name)+' · '+s.files+' SAS file'+(s.files>1?'s':'')+'</div><div class="mono muted" style="font-size:12px">Insider Knowledge Standard Reports/'+e(s.name)+(st.r&&st.r.srcChanged?' · modified '+st.r.srcDate+' (after publish)':'')+'</div></div><span class="chip '+st.c+'">'+st.t+'</span></label>';
  }).join('');
  return '<div class="stack"><div><h1>Load from source</h1><p class="muted" style="margin:4px 0 0">Choose report program files from this environment\'s source location. The AI generates a draft for each report; nothing is visible to Report Concierge until it is reviewed and published.</p></div>'+flowSteps(0)+
  '<div class="card pad row"><div style="flex:1 1 380px"><div class="lbl">Source location (UAT)</div><div class="mono" style="font-size:13px;margin-top:2px">[UAT network drive] › Insider Knowledge Standard Reports</div><div class="muted" style="font-size:12px;margin-top:2px">Last indexed '+S.lastIndexed+' · '+S.sources.length+' report folders · Future: read the latest developer-published files from the SAS report repository</div></div>'+B('Refresh source list','','refresh')+'</div>'+
  '<div class="card"><div class="row pad" style="border-bottom:1px solid #EDF0F2"><label class="row" style="gap:6px"><span class="lbl">Platform</span><select class="inp" data-field="platform"><option'+(S.platform==='Insider Knowledge'?' selected':'')+'>Insider Knowledge</option><option'+(S.platform==='SCORE'?' selected':'')+'>SCORE</option><option'+(S.platform==='Client Knowledge'?' selected':'')+'>Client Knowledge</option></select></label>'+
  '<label style="flex:1 1 240px"><span style="position:absolute;left:-9999px">Filter source reports</span><input class="inp" data-field="srcQ" value="'+e(S.srcQ)+'" placeholder="Filter by folder or report name"></label>'+
  '<label class="row" style="gap:6px;font-size:13px"><input type="checkbox" data-chk="incl"'+(S.incl?' checked':'')+' style="width:18px;height:18px;accent-color:var(--g)">Include reports that already have a draft or published version</label></div>'+
  '<div class="row pad" style="border-bottom:1px solid #EDF0F2;gap:8px">'+B('Select all shown','btn-sm','selAll')+B('Clear selection','btn-sm','selNone')+'<span class="muted" style="font-size:13px">Tip: select one folder for a single report, or a whole category for a batch.</span></div>'+
  (rows||'<div class="pad muted">No new or changed reports. Tick “Include reports that already have a draft or published version” to regenerate others.</div>')+'</div>'+
  '<div class="card pad row"><div style="flex:1 1 300px"><strong>'+sel.length+' report'+(sel.length===1?'':'s')+' selected</strong><div class="muted" style="font-size:12px">Published reports get a new working draft; the published version stays live until the draft is published.</div></div>'+
  '<label class="btn" for="upl" style="cursor:pointer">Upload from my computer</label><input type="file" id="upl" accept=".sas" multiple data-file="1" style="position:absolute;left:-9999px">'+
  '<button class="btn btn-p" data-act="generate"'+(sel.length?'':' disabled')+'>Generate draft'+(sel.length>1?'s ('+sel.length+')':'')+'</button></div></div>';
}

/* ---------- jobs ---------- */
function vJobs(){
  var j=S.jobs.find(function(x){return x.id===S.jid;})||S.jobs[0];
  var side=S.jobs.map(function(x){var d=x.items.filter(function(i){return i.st==='Completed'||i.st==='Failed';}).length,f=x.items.filter(function(i){return i.st==='Failed';}).length;
    return '<button class="jobcard'+(x.id===j.id?' on':'')+'" data-act="job" data-arg="'+x.id+'"><div class="row" style="justify-content:space-between"><strong>'+e(x.name)+'</strong><span class="chip '+(d<x.items.length?'c-run':(f?'c-err':'c-pub'))+'">'+(d<x.items.length?'Running':(f?'Completed with issues':'Completed'))+'</span></div><div class="muted" style="font-size:12px;margin-top:4px">'+d+'/'+x.items.length+' processed · '+x.started+'</div><div class="bar"><div style="width:'+Math.round(d/x.items.length*100)+'%"></div></div></button>';}).join('');
  var stc={Completed:'ok',Failed:'err',Running:'warn',Queued:'mute'};
  var rows=j.items.map(function(i){var a=i.rid?B('Open draft','btn-sm','open',i.rid):(i.st==='Failed'?B('Retry','btn-sm','retry',i.f):'');
    return '<tr><td style="font-weight:600">'+e(i.f)+'</td><td class="'+stc[i.st]+'">'+i.st+'</td><td class="muted">'+e(i.msg)+'</td><td>'+a+'</td></tr>';}).join('');
  return '<div class="stack"><div><h1>Batch jobs</h1><p class="muted" style="margin:4px 0 0">Background AI extraction. Each completed item becomes a draft to review in Reports; publishing happens only after review.</p></div>'+flowSteps(1)+
  '<div class="split"><div class="side">'+side+'</div><div class="main card scroll"><div class="row pad" style="border-bottom:1px solid #EDF0F2"><h2 style="flex:1">'+e(j.name)+'</h2>'+B('Review drafts in Reports','btn-p','reviewDrafts')+'</div>'+
  '<table class="tbl" style="min-width:620px"><thead><tr><th>Report</th><th>Status</th><th>Message</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div></div>';
}

/* ---------- detail ---------- */
var FIELDS=[
  {k:'name',label:'Report name',req:1},{k:'platform',label:'Platform'},
  {k:'biz',label:'Business description (shown to users)',req:1,multi:1,ai:1},
  {k:'internal',label:'Technical description',multi:1,ai:1},
  {k:'purpose',label:'Purpose / when to use it',ai:1},{k:'users',label:'Intended users',ai:1},
  {k:'keywords',label:'Search keywords',ai:1,full:1},{k:'outputs',label:'Output types',ai:1},{k:'folder',label:'Report category'},
  {k:'notes',label:'Reviewer notes',multi:1}
];
function editable(r){return r.status==='Draft'||r.status==='In review'||(r.status==='Published'&&!!r.wd);}
function vDetail(){
  var r=rep(S.rid),ed=editable(r),a='';
  if(r.status==='Draft')a=B('Delete draft','btn-d','delDraft')+B('Submit for review','btn-p','status','In review');
  if(r.status==='In review')a=B('Return to draft','','status','Draft')+B('Publish in UAT','btn-p','modal','publish');
  if(r.status==='Published'&&!r.wd){a=B('Archive','','modal','archive')+B('Unpublish','','modal','unpublish')+B('Regenerate from source','','modal','regen')+B('Edit','','editWd')+(r.prodVer<r.ver?(r.ready?B('Ready for Prod ✓','','unready'):B('Mark ready for Production','btn-p','ready')):'');}
  if(r.status==='Published'&&r.wd)a=B('Discard working draft','','discard')+B('Publish changes (v'+(r.ver+1)+')','btn-p','modal','publish');
  if(r.status==='Archived')a=B('Restore as draft','btn-p','restore');
  var step=r.status==='Draft'||r.status==='In review'||r.wd?1:(r.status==='Published'?(r.prodVer>=r.ver?4:(r.ready?3:2)):-1);
  var h='<div class="stack"><div>'+B('← Reports','btn-sm btn-gh','tab','reports')+
  '<div class="row" style="margin-top:4px;align-items:flex-start"><div style="flex:1 1 380px;min-width:0"><div class="row" style="gap:10px"><h1>'+e(r.name)+'</h1>'+stChip(r.status)+flags(r)+'</div>'+
  '<div class="muted mono" style="font-size:12px;margin-top:4px">'+e(r.path)+' · source file dated '+r.srcDate+' · UAT '+(r.ver?'v'+r.ver:'not published')+' · Production '+(r.prodVer?'v'+r.prodVer:'not promoted')+'</div></div><div class="row" style="gap:8px">'+a+'</div></div></div>'+flowSteps(step);
  if(r.srcChanged&&r.status==='Published'&&!r.wd)h+='<div class="banner b-chg row"><span style="flex:1 1 300px"><strong>Program file changed on '+r.srcDate+'</strong>, after v'+r.ver+' was published. Regenerate to get updated AI suggestions; v'+r.ver+' stays live meanwhile.</span>'+B('Regenerate from source','','modal','regen')+'</div>';
  if(r.wd)h+='<div class="banner b-warn"><strong>Working draft ('+e(r.wd.type)+', started '+r.wd.started+').</strong> Report Concierge keeps using published v'+r.ver+' until you publish these changes. No delete needed.</div>';
  if(r.status==='Archived')h+='<div class="banner b-mute"><strong>Archived.</strong> Kept for history; not suggested by Report Concierge.</div>';
  if(r.ready&&r.status==='Published'&&r.prodVer<r.ver)h+='<div class="banner b-ok row"><span style="flex:1">Marked ready for Production. It will appear in <strong>Promote to Production</strong>.</span>'+B('Go to Promote','btn-sm','tab','promote')+'</div>';
  var ai=aiDone(r);
  if(ed&&ai<AIK.length)h+='<div class="banner b-info">'+ai+' of '+AIK.length+' AI-suggested fields reviewed. Mark each one reviewed or edit it; every field is on this one form.</div>';
  var tabs=[['overview','Overview'],['criteria','Criteria & parameters'],['outputs','Output fields & lineage'],['search','Report Concierge'],['history','History & versions']];
  h+='<div class="row" style="border-bottom:1px solid var(--line);gap:0">'+tabs.map(function(t){return '<button class="dtab'+(S.dtab===t[0]?' on':'')+'" data-act="dtab" data-arg="'+t[0]+'">'+t[1]+'</button>';}).join('')+'<span style="flex:1"></span>'+B('Open detailed document','btn-sm','toast','Opens the existing detailed review document')+' '+B('Download workbook','btn-sm','toast','Downloads the Excel review workbook')+' '+B('Show raw JSON','btn-sm','toast','Shows the raw draft JSON (existing feature)')+'</div>';
  if(S.dtab==='overview'){
    h+='<div class="card form">'+FIELDS.map(function(f,i){
      var v=r[f.k]||'',cls='fld '+(f.multi||f.full?'full':(i%2===0?'l':''));
      var badge=f.ai?(r.acc[f.k]?' <span class="chip c-pub" style="height:20px">Reviewed</span>':' <span class="ai">AI suggestion</span>'):'';
      var ctl=ed?(f.multi?'<textarea class="inp" data-field="r:'+f.k+'" aria-label="'+f.label+'">'+e(v)+'</textarea>':'<input class="inp" data-field="r:'+f.k+'" value="'+e(v)+'" aria-label="'+f.label+'">'):'<div style="white-space:pre-line">'+(v?e(v):'<span class="muted">—</span>')+'</div>';
      var mark=f.ai&&ed?' <button class="btn btn-sm" data-act="acc" data-arg="'+f.k+'" style="margin-left:auto">'+(r.acc[f.k]?'Undo reviewed':'Mark reviewed')+'</button>':'';
      return '<div class="'+cls+'"><div class="row" style="gap:6px"><span class="lbl">'+f.label+(f.req?' <span style="color:#A3261B">*</span>':'')+'</span>'+badge+mark+'</div><div style="margin-top:6px">'+ctl+'</div></div>';
    }).join('')+'</div>';
  }
  if(S.dtab==='criteria')h+='<div class="card scroll"><div class="pad" style="border-bottom:1px solid #EDF0F2"><strong>What a user chooses before running the report</strong> <span class="ai">AI suggestion</span></div><table class="tbl" style="min-width:700px"><thead><tr><th>Parameter</th><th>Meaning</th><th>Type</th><th>Required</th></tr></thead><tbody>'+
    r.crit.map(function(c,i){return '<tr><td class="mono">'+e(c[0])+'</td><td>'+(ed?'<input class="inp" data-field="crit:'+i+'" value="'+e(c[1])+'">':e(c[1]))+'</td><td>'+e(c[2])+'</td><td>'+c[3]+'</td></tr>';}).join('')+'</tbody></table></div>';
  if(S.dtab==='outputs')h+='<div class="card scroll"><div class="pad" style="border-bottom:1px solid #EDF0F2"><strong>Output fields with description and lineage</strong> <span class="ai">AI suggestion</span> <span class="muted" style="font-size:12px">Lineage = where each output comes from in the database</span></div><table class="tbl" style="min-width:860px"><thead><tr><th>Output field</th><th>Description</th><th>Lineage (source)</th><th>Type / format</th></tr></thead><tbody>'+
    r.outs.map(function(o,i){return '<tr><td class="mono" style="font-weight:600">'+e(o[0])+'</td><td>'+(ed?'<input class="inp" data-field="out:'+i+'" value="'+e(o[1])+'">':e(o[1]))+'</td><td class="mono" style="font-size:12px">'+e(o[2])+'</td><td>'+e(o[3])+'</td></tr>';}).join('')+'</tbody></table></div>';
  if(S.dtab==='search'){var sr=search(r);
    h+='<div class="grid4"><div class="card pad"><div class="lbl">Suggested by Report Concierge?</div><div class="'+sr[1]+'" style="font-size:16px;margin-top:4px">'+(r.status==='Published'?'Yes':'No')+'</div></div><div class="card pad"><div class="lbl">Version in use</div><div style="font-size:16px;font-weight:600;margin-top:4px">'+(r.status==='Published'?'v'+r.ver:'—')+'</div></div><div class="card pad"><div class="lbl">Index status</div><div class="'+sr[1]+'" style="font-size:16px;margin-top:4px">'+sr[0]+'</div></div><div class="card pad"><div class="lbl">Embedded fields</div><div style="font-size:13px;margin-top:6px">Name, business description, keywords, output fields, parameters</div></div></div>'+
    (r.status!=='Published'?'<div class="banner b-mute">Drafts, reports in review and archived reports are never suggested to users. The report may still exist and be runnable in BI tools.</div>':'');}
  if(S.dtab==='history'){
    var vers=[];for(var v=r.ver;v>=1;v--)vers.push('<tr><td>v'+v+'</td><td>'+(v===r.ver?'Published in UAT (live)':'Superseded')+'</td><td>'+(r.prodVer===v?'<span class="ok">In Production</span>':(r.prodVer>v?'Replaced in Production':'—'))+'</td></tr>');
    if(r.wd)vers.unshift('<tr><td>v'+(r.ver+1)+'</td><td><span class="chip c-wd">Working draft</span></td><td>—</td></tr>');
    h+='<div class="split"><div class="main card"><div class="pad" style="border-bottom:1px solid #EDF0F2"><strong>Activity</strong></div>'+r.hist.map(function(x){return '<div class="row" style="padding:10px 18px;border-bottom:1px solid #EDF0F2;gap:6px 16px"><span class="mono muted" style="flex:0 0 160px;font-size:12px">'+x[0]+'</span><span style="flex:0 0 80px;font-weight:600">'+x[1]+'</span><span style="flex:1 1 260px">'+e(x[2])+'</span></div>';}).join('')+'</div>'+
    '<div class="card scroll" style="flex:1 1 360px;max-width:460px"><div class="pad" style="border-bottom:1px solid #EDF0F2"><strong>Versions</strong></div><table class="tbl"><thead><tr><th>Version</th><th>UAT</th><th>Production</th></tr></thead><tbody>'+(vers.join('')||'<tr><td colspan="3" class="muted">Not published yet</td></tr>')+'</tbody></table></div></div>';
  }
  return h+'</div>';
}

/* ---------- promote ---------- */

  '<div class="card scroll"><div class="pad" style="border-bottom:1px solid #EDF0F2"><strong>Promotion log</strong></div><table class="tbl" style="min-width:700px"><thead><tr><th>Date</th><th>Report</th><th>Version</th><th>Change</th><th>By</th></tr></thead><tbody>'+S.plog.map(function(l){return '<tr><td class="mono" style="font-size:12px">'+l[0]+'</td><td>'+e(l[1])+'</td><td>'+l[2]+'</td><td>'+l[3]+'</td><td>'+l[4]+'</td></tr>';}).join('')+'</tbody></table></div></div>';
}

/* ---------- library ---------- */
function vLibrary(){
  var k=S.lib.find(function(x){return x.id===S.kid;})||S.lib[0];
  var side=S.lib.map(function(x){return '<button class="jobcard'+(x.id===k.id?' on':'')+'" data-act="lib" data-arg="'+x.id+'"><div class="row" style="justify-content:space-between;gap:6px"><strong style="flex:1">'+e(x.title)+'</strong>'+stChip(x.status)+'</div><div class="muted" style="font-size:12px;margin-top:4px">'+x.type+' · '+e(x.reports)+'</div></button>';}).join('');
  var acts=k.status==='Published'?B('Unpublish','','libSt','Draft')+B('Archive','','libSt','Archived'):(k.status==='Draft'?B('Publish','btn-p','libSt','Published'):B('Restore as draft','btn-p','libSt','Draft'));
  return '<div class="stack"><div class="row" style="align-items:flex-end"><div style="flex:1 1 360px"><h1>Resource Library</h1><p class="muted" style="margin:4px 0 0">FAQs, how-to documents and links that Report Concierge can use alongside report metadata. Renamed from “Knowledge Base” (name to confirm). Lower priority than Reports for MVP.</p></div>'+B('+ Add resource','','toast','Add an FAQ, upload a PDF/Word document, or link a Confluence page')+'</div>'+
  '<div class="split"><div class="side">'+side+'</div><div class="main card pad stack"><div class="row" style="gap:10px"><h2 style="flex:1">'+e(k.title)+'</h2>'+stChip(k.status)+'</div>'+
  '<div class="row" style="gap:8px"><span class="lbl">Source:</span><span>'+e(k.src)+'</span>'+B(k.type==='Confluence page'?'Open Confluence page ↗':'Open original document ↗','btn-sm','toast','Opens '+k.link+' so a person can read the original')+'</div>'+
  '<div><div class="lbl">Content used by Report Concierge</div><div style="margin-top:6px;white-space:pre-line">'+e(k.body)+'</div></div>'+
  '<div><div class="lbl">Applies to</div><div style="margin-top:4px">'+e(k.reports)+'</div></div><div class="row" style="gap:8px">'+B('Edit','','toast','Edit form (existing Edit FAQ)')+acts+'</div></div></div></div>';
}

/* ---------- other top views ---------- */
function vConcierge(){return '<div class="card pad" style="max-width:640px"><div class="lbl" style="letter-spacing:.08em">REPORT CONCIERGE</div><h1 style="margin:8px 0">Ask the concierge from the launcher.</h1><p class="muted">Existing page. Admins open <strong>Human Review</strong> from the top bar to manage report content.</p>'+B('Go to Human Review','btn-p','top','review')+'</div>';}
function vFeedback(){
  return '<div class="stack"><div><h1>Feedback Inbox</h1><p class="muted" style="margin:4px 0 0">Existing page. New: thumbs-down items link straight to the report record to fix.</p></div>'+S.feedback.map(function(f){
    return '<div class="card pad stack" style="gap:8px"><div class="row"><div style="flex:1"><div class="lbl">USER QUERY</div><strong>'+e(f.q)+'</strong></div><span class="chip '+(f.up?'c-pub':'c-err')+'">'+(f.up?'Thumbs up':'Thumbs down')+'</span></div><div class="muted">'+e(f.a)+'</div>'+
    (f.up?'':'<div class="banner b-err"><strong>'+e(f.reason)+'.</strong> '+e(f.comment)+'</div>')+(f.rid&&!f.up?'<div>'+B('Open report record to fix','btn-sm','fbOpen',f.rid)+'</div>':(!f.up?'<div class="muted" style="font-size:12px">Suggested report is not in the dictionary yet → '+B('Load it from source','btn-sm','tab','load')+'</div>':''))+'</div>';
  }).join('')+'</div>';
}

/* ---------- modal ---------- */
function vModal(){
  var m=S.modal;if(!m)return '';var r=rep(S.rid),t,intro,steps,lbl,warn='',block='';
  if(m==='publish'){
    var miss=[['name','Report name'],['biz','Business description']].filter(function(x){return !r[x[0]];}).map(function(x){return x[1];});
    if(miss.length)block='Missing required: '+miss.join(', ')+'.';
    if(aiDone(r)<AIK.length)warn=(AIK.length-aiDone(r))+' AI-suggested field(s) not marked reviewed.';
    t='Publish “'+r.name+'” in UAT'+(r.wd?' as v'+(r.ver+1):'');intro='Publishing makes this version the one Report Concierge suggests in UAT.';
    steps=['Validate required fields',r.wd?'Replace v'+r.ver+' with v'+(r.ver+1)+' in one step (no gap, no delete)':'Create v1 as the published version','Refresh embeddings and search index','Record in history','Production is unchanged until you promote'];lbl='Publish';
  }
  if(m==='unpublish'){t='Unpublish “'+r.name+'”';intro='Stops Report Concierge suggesting it in UAT. Metadata and history are kept.';steps=['Remove from search index','Keep record and versions','Record in history'];lbl='Unpublish';}
  if(m==='archive'){t='Archive “'+r.name+'”';intro='Retire the report without losing history. Use this instead of delete.';steps=['Remove from Report Concierge','Keep all versions and history','Record who archived it and when'];lbl='Archive';}
  if(m==='regen'){t='Regenerate “'+r.name+'” from source';intro='Runs the current program file through the AI and creates a working draft with new suggestions.';steps=['Read '+r.path+' (dated '+r.srcDate+')','Generate new AI suggestions into a working draft','Keep published v'+r.ver+' live until the draft is published','You review the differences before publishing'];lbl='Regenerate';}
  if(m==='promote'){var n=readyList().filter(function(x){return S.promSel[x.id];});t='Promote '+n.length+' report'+(n.length>1?'s':'')+' to Production';intro=n.map(function(x){return x.name+' v'+x.ver;}).join(', ');steps=['Copy approved metadata to the Production data dictionary','Build Production embeddings and index','Replace the previous Production version where one exists','Record in the promotion log'];lbl='Promote';}
  return '<div class="overlay"><div role="dialog" aria-modal="true" class="card pad" style="width:100%;max-width:560px;padding:24px"><h2 style="margin-bottom:6px">'+e(t)+'</h2><p class="muted" style="margin:0 0 14px">'+e(intro)+'</p>'+
  (block?'<div class="banner b-err" style="margin-bottom:12px"><strong>Can\'t publish yet.</strong> '+block+'</div>':'')+(warn?'<div class="banner b-warn" style="margin-bottom:12px">'+warn+'</div>':'')+
  '<ol style="margin:0 0 18px;padding-left:20px">'+steps.map(function(s){return '<li style="margin-bottom:4px">'+e(s)+'</li>';}).join('')+'</ol><div class="row" style="justify-content:flex-end;gap:8px">'+B('Cancel','','close')+'<button class="btn btn-p" data-act="confirm"'+(block?' disabled':'')+'>'+lbl+'</button></div></div></div>';
}

function render(){
  var a=document.activeElement,fid=a&&a.getAttribute&&a.getAttribute('data-field'),ss=a&&a.selectionStart,se=a&&a.selectionEnd;
  var body;
  if(S.top==='concierge')body=vConcierge();else if(S.top==='feedback')body=vFeedback();
  else{body='<div><h1 style="font-size:28px">Human review</h1><p class="muted" style="margin:4px 0 0">Load report program files, review AI drafts, publish in UAT and promote approved reports to Production.</p></div>'+vTabs()+
    (S.tab==='reports'?(S.screen==='detail'?vDetail():vReports()):S.tab==='load'?vLoad():S.tab==='jobs'?vJobs():S.tab==='promote'?vPromote():vLibrary());}
  document.getElementById('app').innerHTML=vHeader()+'<main>'+body+'</main>'+vModal()+(S.toast?'<div class="toast" role="status">'+e(S.toast)+'</div>':'');
  if(fid){var el=document.querySelector('[data-field="'+fid+'"]');if(el){el.focus();try{el.setSelectionRange(ss,se);}catch(x){}}}
}

/* ---------- actions ---------- */
function runJob(names){
  var id='B'+(17+S.jobs.length-2),job={id:id,name:'Batch '+(17+S.jobs.length-2)+' · '+S.platform,started:TODAY+' '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),items:names.map(function(n){return {f:n,st:'Queued',msg:'Waiting…'};})};
  S.jobs.unshift(job);S.jid=id;S.tab='jobs';S.srcSel={};
  job.items.forEach(function(it,i){
    setTimeout(function(){it.st='Running';it.msg='Extracting metadata from SAS…';render();},700+i*500);
    setTimeout(function(){
      var ex=S.reports.find(function(r){return r.folder===it.f&&r.status!=='Archived';});
      if(ex&&ex.status==='Published'){ex.snap={biz:ex.biz,internal:ex.internal};ex.wd={type:'Regenerated from source',started:TODAY};ex.srcChanged=false;
        ex.biz=ex.biz+(it.f==='Participation'?' Now includes a monthly participation trend.':'');ex.acc={internal:1,purpose:1,users:1,outputs:1};hist(ex,'Regenerated from source (batch) · working draft created, v'+ex.ver+' stays live');it.rid=ex.id;it.msg='Working draft created · published v'+ex.ver+' stays live';}
      else if(ex){ex.acc={};hist(ex,'Regenerated from source (batch)');it.rid=ex.id;it.msg='Existing draft refreshed';}
      else{var src=S.sources.find(function(s){return s.name===it.f;})||{files:1};var nr=mk({id:nid(),name:it.f,folder:it.f,files:src.files,platform:S.platform,modified:TODAY,by:'batch',srcDate:'10/20/2026',
        biz:'AI-suggested: '+it.f+' report for the Insider Knowledge platform. Review and adjust before publishing.',internal:'AI-suggested technical description generated from '+src.files+' SAS program file(s).',purpose:'',keywords:it.f.replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase(),users:'',hist:[]});
        hist(nr,'Draft generated from source ('+job.name+')');S.reports.unshift(nr);it.rid=nr.id;it.msg='Draft created';}
      it.st='Completed';render();
    },1800+i*900);
  });
  toast(names.length+' report'+(names.length>1?'s':'')+' queued for AI extraction');
}
var ACT={
  top:function(a){S.top=a;S.modal=null;render();},
  tab:function(a){S.top='review';S.tab=a;S.screen='list';S.modal=null;render();},
  tile:function(a){S.fS=S.fS===a?'All':a;S.fFlag='All';S.q='';render();},
  fS:function(a){S.fS=a;render();},fFlag:function(a){S.fFlag=a;render();},
  clear:function(){S.fS='All';S.fFlag='All';S.q='';render();},
  open:function(id){S.top='review';S.tab='reports';S.screen='detail';S.rid=id;S.dtab='overview';render();},
  fbOpen:function(id){ACT.open(id);toast('Opened from feedback · edit as a working draft to fix the description');},
  dtab:function(a){S.dtab=a;render();},
  acc:function(k){var r=rep(S.rid);r.acc[k]=!r.acc[k];render();},
  status:function(s){var r=rep(S.rid);r.status=s;hist(r,s==='In review'?'Submitted for review':'Returned to draft');toast(s==='In review'?'Submitted for review':'Returned to draft');},
  delDraft:function(){var r=rep(S.rid);S.reports=S.reports.filter(function(x){return x!==r;});S.screen='list';toast('Draft deleted (drafts only; published reports are archived instead)');},
  editWd:function(){var r=rep(S.rid);r.snap={biz:r.biz,internal:r.internal,purpose:r.purpose,keywords:r.keywords,users:r.users,outputs:r.outputs};r.wd={type:'Manual edit',started:TODAY};hist(r,'Working draft started (manual edit) · v'+r.ver+' stays live');toast('Working draft created · v'+r.ver+' stays live in Report Concierge');},
  discard:function(){var r=rep(S.rid);if(r.snap)Object.assign(r,r.snap);r.wd=null;r.snap=null;hist(r,'Working draft discarded');toast('Working draft discarded · v'+r.ver+' unchanged');},
  ready:function(){var r=rep(S.rid);r.ready=true;hist(r,'Marked ready for Production');toast('Marked ready for Production');},
  unready:function(){var r=rep(S.rid);r.ready=false;hist(r,'Removed from ready for Production');render();},
  restore:function(){var r=rep(S.rid);r.status='Draft';hist(r,'Restored as draft');toast('Restored as draft');},
  modal:function(a){S.modal=a;render();},close:function(){S.modal=null;render();},
  confirm:function(){
    var m=S.modal,r=rep(S.rid);S.modal=null;
    if(m==='publish'){if(r.wd){r.ver++;r.wd=null;r.snap=null;r.ready=false;}else{r.ver=Math.max(1,r.ver+(r.status==='Published'?1:(r.ver?0:1)));}r.status='Published';r.published=TODAY;r.srcChanged=false;hist(r,'Published v'+r.ver+' in UAT · embeddings refreshed');toast('Published v'+r.ver+' in UAT · Report Concierge now uses it');}
    if(m==='unpublish'){r.status='Draft';r.ready=false;hist(r,'Unpublished in UAT');toast('Unpublished · record and history kept');}
    if(m==='archive'){r.status='Archived';r.ready=false;r.wd=null;hist(r,'Archived · removed from Report Concierge, history kept');toast('Archived · history kept');}
    if(m==='regen'){r.snap={biz:r.biz,internal:r.internal};r.wd={type:'Regenerated from source',started:TODAY};r.srcChanged=false;r.acc={purpose:1,users:1,outputs:1};r.biz=r.biz+(r.name==='Participation'?' Now includes a monthly participation trend.':'');hist(r,'Regenerated from source · working draft created, v'+r.ver+' stays live');toast('Working draft created from the current program file · review and publish when ready');}
    if(m==='promote'){var n=readyList().filter(function(x){return S.promSel[x.id];});n.forEach(function(x){S.plog.unshift([TODAY+' '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),x.name,'v'+x.ver,x.prodVer?'Update v'+x.prodVer+' → v'+x.ver:'New in Production','you']);x.prodVer=x.ver;x.ready=false;hist(x,'Promoted v'+x.ver+' to Production');});S.promSel={};toast(n.length+' report'+(n.length>1?'s':'')+' promoted to Production');return;}
    render();
  },
  refresh:function(){S.lastIndexed=TODAY+' '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});var p=S.reports.find(function(r){return r.name==='PremiumByState';});toast('Source list refreshed · 1 program file changed since publish (Participation)');},
  selAll:function(){document.querySelectorAll('[data-chk="src"]').forEach(function(c){S.srcSel[c.getAttribute('data-arg')]=true;});render();},
  selNone:function(){S.srcSel={};render();},
  generate:function(){var n=Object.keys(S.srcSel).filter(function(k){return S.srcSel[k];});if(n.length)runJob(n);},
  job:function(id){S.jid=id;render();},
  retry:function(f){var j=S.jobs.find(function(x){return x.id===S.jid;});var it=j.items.find(function(i){return i.f===f;});it.st='Running';it.msg='Retrying…';render();setTimeout(function(){it.st='Failed';it.msg='Still failing: macro library with no report output. Mark as not a report, or load manually.';render();},1500);},
  reviewDrafts:function(){S.tab='reports';S.screen='list';S.fS='Draft';S.fFlag='All';render();},
  promote:function(){S.modal='promote';render();},
  lib:function(id){S.kid=id;render();},
  libSt:function(s){var k=S.lib.find(function(x){return x.id===S.kid;});k.status=s;toast('Resource '+s.toLowerCase());},
  toast:function(m){toast(m);}
};
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-act]');if(!t||t.disabled)return;var a=t.getAttribute('data-act');if(ACT[a])ACT[a](t.getAttribute('data-arg'));});
document.addEventListener('input',function(ev){
  var f=ev.target.getAttribute('data-field');if(!f)return;var v=ev.target.value;
  if(f==='q'||f==='srcQ'){S[f]=v;render();return;}
  if(f==='sort'||f==='platform'){S[f]=v;render();return;}
  var p=f.split(':'),r=rep(S.rid);
  if(p[0]==='r')r[p[1]]=v;if(p[0]==='crit')r.crit[+p[1]][1]=v;if(p[0]==='out')r.outs[+p[1]][1]=v;
});
document.addEventListener('change',function(ev){
  var c=ev.target.getAttribute('data-chk');
  if(c==='src'){S.srcSel[ev.target.getAttribute('data-arg')]=ev.target.checked;render();}
  if(c==='incl'){S.incl=ev.target.checked;render();}
  if(c==='prom'){S.promSel[ev.target.getAttribute('data-arg')]=ev.target.checked;render();}
  if(ev.target.getAttribute('data-file')){var fs=Array.prototype.slice.call(ev.target.files||[]);var ok=fs.filter(function(f){return /\.sas$/i.test(f.name);});
    if(fs.length>ok.length)toast((fs.length-ok.length)+' file(s) skipped: only .sas is supported');
    if(ok.length){ok.forEach(function(f){var n=f.name.replace(/\.sas$/i,'');if(!S.sources.find(function(s){return s.name===n;}))S.sources.push({name:n,files:1});});runJob(ok.map(function(f){return f.name.replace(/\.sas$/i,'');}));}}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.modal){S.modal=null;render();}});
render();
})();
</script>
</body>
</html>
