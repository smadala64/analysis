<svg xmlns="http://www.w3.org/2000/svg" width="1332" height="938" viewBox="0 0 1332 938">
<style>
  .n{fill:#FFFFFF;stroke:#CFD7DE;stroke-width:1.5}
  .n-sunk{fill:#E9EDF0;stroke:#CFD7DE;stroke-width:1.5}
  .n-det{fill:#E4F2E5;stroke:#15701F;stroke-width:2.5}
  .n-llm{fill:#F6EADF;stroke:#9A5116;stroke-width:1.5;stroke-dasharray:6 4}
  .n-llm-s{fill:#F6EADF;stroke:#9A5116;stroke-width:2}
  .n-allow{fill:#E4F2E5;stroke:#15701F;stroke-width:2}
  .n-deny{fill:#F6E4E6;stroke:#8C2F39;stroke-width:2}
  .zone{fill:none;stroke:#CFD7DE;stroke-width:1;stroke-dasharray:4 4}
  .zone-ext{fill:none;stroke:#9A5116;stroke-width:1;stroke-dasharray:4 4}
  .life{stroke:#CFD7DE;stroke-width:1;stroke-dasharray:3 4}
  .bnd{stroke:#4B5763;stroke-width:1.25;stroke-dasharray:7 5}
  .t{fill:#141A20;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:600;font-size:12.5px}
  .t-lg{fill:#141A20;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:600;font-size:13px}
  .ts{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px}
  .tk{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.07em}
  .zlab{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10px;letter-spacing:.09em}
  .tl{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
  .tl-em{fill:#141A20;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;font-weight:500;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
  .a{stroke:#4B5763;stroke-width:1.5;fill:none;marker-end:url(#ah)}
  .a-llm{stroke:#9A5116;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#ah-llm)}
  .a-det{stroke:#15701F;stroke-width:2.5;fill:none;marker-end:url(#ah-det)}
  .a-allow{stroke:#15701F;stroke-width:2;fill:none;marker-end:url(#ah-allow)}
  .a-deny{stroke:#8C2F39;stroke-width:2;fill:none;marker-end:url(#ah-deny)}
  .a-oob{stroke:#4B5763;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#ah)}
  .bg{fill:#15701F} .bg-llm{fill:#9A5116}
  .bn{fill:#FFFFFF;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;font-weight:700;font-size:9.5px}
  .tw{fill:#8C2F39;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.07em}
  .tg{fill:#15701F;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9.5px;letter-spacing:.07em}
  .ref{fill:#4B5763;font-family:'IBM Plex Mono',Consolas,monospace;font-size:9px;opacity:.85}
  .feed{stroke:#4B5763;stroke-width:1.5;fill:none}
  .runtime{fill:#E9EDF0;stroke:#4B5763;stroke-width:1.25}
  .n-warn{fill:#F6EADF;stroke:#9A5116;stroke-width:2.5}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5763"/></marker>
  <marker id="ah-llm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A5116"/></marker>
  <marker id="ah-det" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15701F"/></marker>
  <marker id="ah-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15701F"/></marker>
  <marker id="ah-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C2F39"/></marker>
</defs>
<rect x="0" y="0" width="1332" height="938" fill="#FFFFFF"/>
<g transform="translate(16,16)">

        <rect class="n-llm" x="976" y="16" width="296" height="46" rx="2"/>
        <text class="t" x="1124" y="37" text-anchor="middle">Azure OpenAI</text>
        <text class="tk" x="1124" y="54" text-anchor="middle">MANAGED SERVICE · NON-DETERMINISTIC</text>

        <rect class="zone" x="16" y="96" width="356" height="66" rx="2"/>
        <text class="zlab" x="28" y="114">MEMBER</text>
        <rect class="n" x="28" y="104" width="300" height="42" rx="2"/>
        <text class="t" x="178" y="130" text-anchor="middle">Member (web browser)</text>

        <line class="a-llm" x1="1060" y1="362" x2="1060" y2="68"/>
        <circle class="bg-llm" cx="1060" cy="112" r="9.5"/>
        <text class="bn" x="1060" y="115.5" text-anchor="middle">2</text>
        <line class="a-llm" x1="1108" y1="68" x2="1108" y2="362"/>
        <circle class="bg-llm" cx="1108" cy="152" r="9.5"/>
        <text class="bn" x="1108" y="155.5" text-anchor="middle">3</text>
        <text class="tl" x="660" y="112">2 · conversation, verified member and enrollment</text>
        <text class="tl" x="660" y="128">context, bound tool schemas — no credentials</text>
        <text class="tl-em" x="660" y="156">3 · the model returns a tool choice and arguments</text>

        <rect class="zone" x="16" y="176" width="1268" height="504" rx="2"/>
        <text class="zlab" x="1040" y="194" text-anchor="end">CHATBOT ORCHESTRATOR SERVICE</text>

        <rect class="n-deny" x="28" y="206" width="252" height="90" rx="2"/>
        <text class="t" x="154" y="228" text-anchor="middle">Session history</text>
        <text class="t" x="154" y="244" text-anchor="middle">endpoint</text>
        <text class="tw" x="154" y="264" text-anchor="middle">NO OWNERSHIP CHECK</text>
        <text class="ts" x="154" y="282" text-anchor="middle">returns state by session id</text>

        <line class="a-deny" x1="154" y1="296" x2="154" y2="324"/>

        <rect class="n" x="28" y="326" width="252" height="240" rx="2"/>
        <text class="t" x="154" y="350" text-anchor="middle">Session state</text>
        <text class="ts" x="154" y="368" text-anchor="middle">held in EMCache</text>
        <text class="tw" x="154" y="394" text-anchor="middle">PLAIN SERIALIZED STATE</text>
        <text class="ts" x="154" y="418" text-anchor="middle">conversation, tool inputs</text>
        <text class="ts" x="154" y="434" text-anchor="middle">and outputs, verified</text>
        <text class="ts" x="154" y="450" text-anchor="middle">member and patient set</text>
        <text class="ts" x="154" y="478" text-anchor="middle">written by identity</text>
        <text class="ts" x="154" y="494" text-anchor="middle">proofing, read by every</text>
        <text class="ts" x="154" y="510" text-anchor="middle">capability</text>

        <rect class="n" x="300" y="206" width="600" height="50" rx="2"/>
        <text class="t" x="600" y="228" text-anchor="middle">Chat API</text>
        <text class="ts" x="600" y="246" text-anchor="middle">HTTPS POST, NDJSON streaming response</text>

        <line class="a" x1="154" y1="146" x2="154" y2="204"/>
        <polyline class="a" points="300,146 300,170 546,170 546,204"/>
        <text class="tl" x="558" y="190">1 · HTTPS</text>

        <rect class="runtime" x="300" y="276" width="972" height="388" rx="2"/>
        <text class="zlab" x="316" y="296">LANGGRAPH RUNTIME — ONE PROCESS, NO INTERNAL BOUNDARY</text>

        <rect class="n" x="316" y="306" width="940" height="44" rx="2"/>
        <text class="t" x="786" y="326" text-anchor="middle">Session router</text>
        <text class="ts" x="786" y="344" text-anchor="middle">is a verified member already in session state?</text>

        <line class="a" x1="546" y1="256" x2="546" y2="304"/>
        <line class="a" x1="546" y1="350" x2="546" y2="362"/>
        <line class="a" x1="1026" y1="350" x2="1026" y2="362"/>

        <rect class="n" x="316" y="364" width="460" height="80" rx="2"/>
        <text class="t" x="546" y="386" text-anchor="middle">Identity proofing</text>
        <text class="tk" x="546" y="404" text-anchor="middle">NO — RUNS FIRST, BEFORE THE REQUEST IS SERVED</text>
        <text class="ts" x="546" y="422" text-anchor="middle">contact lookup, passcode, enrollments</text>
        <text class="ts" x="546" y="438" text-anchor="middle">then the original request resumes</text>

        <rect class="n" x="796" y="364" width="460" height="80" rx="2"/>
        <text class="t" x="1026" y="386" text-anchor="middle">Context assembly and model call</text>
        <text class="tk" x="1026" y="404" text-anchor="middle">YES — THE MEMBER FLOW IS SERVED</text>
        <text class="ts" x="1026" y="422" text-anchor="middle">conversation and verified member context</text>
        <text class="ts" x="1026" y="438" text-anchor="middle">the model proposes a capability and a patient</text>

        <line class="a-det" x1="316" y1="400" x2="284" y2="400"/>
        <polyline class="a" points="700,444 700,452 900,452 900,446"/>

        <rect class="n" x="316" y="466" width="940" height="42" rx="2"/>
        <text class="t" x="786" y="484" text-anchor="middle">Tool dispatch</text>
        <text class="tk" x="786" y="500" text-anchor="middle">4 · EACH CAPABILITY ENFORCES ITS OWN SCOPE — THERE IS NO CENTRAL GATE HERE</text>

        <line class="a" x1="1026" y1="444" x2="1026" y2="464"/>
        <line class="a" x1="466" y1="508" x2="466" y2="520"/>
        <line class="a" x1="786" y1="508" x2="786" y2="520"/>
        <line class="a" x1="1106" y1="508" x2="1106" y2="520"/>

        <rect class="n-det" x="316" y="522" width="300" height="76" rx="2"/>
        <text class="t" x="466" y="544" text-anchor="middle">Benefit inquiry</text>
        <text class="tg" x="466" y="564" text-anchor="middle">MEMBER SCOPE ENFORCED</text>
        <text class="ts" x="466" y="584" text-anchor="middle">no call for an unverified patient</text>

        <rect class="n-det" x="636" y="522" width="300" height="76" rx="2"/>
        <text class="t" x="786" y="544" text-anchor="middle">Benefits summary</text>
        <text class="tg" x="786" y="564" text-anchor="middle">MEMBER SCOPE ENFORCED</text>
        <text class="ts" x="786" y="584" text-anchor="middle">no call for an unverified patient</text>

        <rect class="n-warn" x="956" y="522" width="300" height="76" rx="2"/>
        <text class="t" x="1106" y="542" text-anchor="middle">Enrollment and identity</text>
        <text class="tw" x="1106" y="560" text-anchor="middle">ENFORCED, BUT FAILS OPEN</text>
        <text class="ts" x="1106" y="578" text-anchor="middle">fields resolved from saved state;</text>
        <text class="ts" x="1106" y="592" text-anchor="middle">an unmatched patient is not stopped</text>

        <line class="a-det" x1="316" y1="544" x2="284" y2="544"/>
        <circle class="bg" cx="292" cy="522" r="9.5"/>
        <text class="bn" x="292" y="525.5" text-anchor="middle">5</text>

        <polyline class="a" points="466,598 466,606 1026,606 1026,610"/>
        <line class="feed" x1="786" y1="598" x2="786" y2="606"/>
        <line class="feed" x1="1106" y1="598" x2="1106" y2="606"/>

        <rect class="n" x="316" y="612" width="460" height="48" rx="2"/>
        <text class="t" x="546" y="632" text-anchor="middle">Service token</text>
        <text class="ts" x="546" y="650" text-anchor="middle">service OAuth token and context headers</text>

        <rect class="n" x="796" y="612" width="460" height="48" rx="2"/>
        <text class="t" x="1026" y="632" text-anchor="middle">MCP client</text>
        <text class="ts" x="1026" y="650" text-anchor="middle">adds the token, session id and context</text>

        <line class="a" x1="776" y1="636" x2="794" y2="636"/>

        <polyline class="a" points="960,664 960,688 334,688 334,720"/>
        <line class="a" x1="1150" y1="664" x2="1150" y2="720"/>

        <rect class="zone" x="16" y="696" width="1268" height="88" rx="2"/>
        <text class="zlab" x="28" y="714">MCP SERVICES</text>
        <text class="tl" x="700" y="714">6 · MCP over HTTP with the service token and context headers</text>

        <rect class="n" x="28" y="722" width="612" height="58" rx="2"/>
        <text class="t" x="334" y="742" text-anchor="middle">Enrollment MCP service</text>
        <text class="ts" x="334" y="758" text-anchor="middle">re-runs the subscriber lookup and filters enrollments</text>
        <text class="ts" x="334" y="774" text-anchor="middle">get_contact_info → send_otp → validate_otp → get_enrollments</text>

        <rect class="n" x="660" y="722" width="612" height="58" rx="2"/>
        <text class="t" x="966" y="742" text-anchor="middle">Benefits MCP service</text>
        <text class="tw" x="966" y="758" text-anchor="middle">STATELESS — NO SESSION TO MEMBER COMPARISON</text>
        <text class="ts" x="966" y="774" text-anchor="middle">validates required fields and serves what it is asked for</text>

        <rect class="zone" x="16" y="800" width="1268" height="90" rx="2"/>
        <text class="zlab" x="28" y="818">BACKEND SERVICES</text>
        <text class="tl" x="700" y="818">7 · REST with the same service token</text>

        <rect class="n" x="28" y="826" width="396" height="54" rx="2"/>
        <text class="t" x="226" y="850" text-anchor="middle">Enrollment service</text>
        <text class="ts" x="226" y="868" text-anchor="middle">member and patient records</text>

        <rect class="n" x="452" y="826" width="396" height="54" rx="2"/>
        <text class="t" x="650" y="850" text-anchor="middle">Passcode delivery</text>
        <text class="ts" x="650" y="868" text-anchor="middle">issues and sends passcodes</text>

        <rect class="n" x="876" y="826" width="396" height="54" rx="2"/>
        <text class="t" x="1074" y="850" text-anchor="middle">Benefits service</text>
        <text class="ts" x="1074" y="868" text-anchor="middle">coverage and benefit detail</text>

        <line class="a" x1="226" y1="780" x2="226" y2="824"/>
        <polyline class="a" points="600,780 600,804 650,804 650,824"/>
        <line class="a" x1="1074" y1="780" x2="1074" y2="824"/>
      </g>
</svg>