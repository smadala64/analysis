:root{--accent:#0F6E7A}
*{box-sizing:border-box}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 24px;background:#1C2128;color:#fff}
.layout{display:flex;flex-wrap:wrap;min-height:calc(100vh - 56px)}
nav{flex:1 1 220px;max-width:260px;min-width:200px;padding:20px 12px;background:#EEF0F3;border-right:1px solid #DDE1E6;display:flex;flex-direction:column;gap:4px}

.nav-item:hover{background:#E4E7EB}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border:1px solid #C9CFD6;border-radius:8px;background:#fff;color:#1C2128;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F0F2F4}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}

.btn-sm{min-height:32px;padding:0 10px;font-size:13px}

.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-draft{background:#FFF1D6;color:#7A4A00}.st-review{background:#E1EAFD;color:#1E44A8}.st-pub{background:#DDF3E6;color:#14653A}.st-arch{background:#E7E9EC;color:#4A525C}

.fchip.on{background:#1C2128;border-color:#1C2128;color:#fff}
.fchip[disabled]{opacity:.55;cursor:not-allowed}
.inp{width:100%;min-height:40px;padding:8px 12px;border:1px solid #C9CFD6;border-radius:8px;background:#fff;font:inherit;color:#1C2128}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.inp{min-height:84px;resize:vertical}
.card{background:#fff;border:1px solid #DDE1E6;border-radius:12px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:1180px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:#5F6873;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid #DDE1E6;background:#FAFBFC;vertical-align:bottom}
.tbl td{padding:12px 14px;border-bottom:1px solid #EDF0F2;vertical-align:middle}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:#F7F9FA}
.col{display:block;font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;font-weight:400;color:#6B5B9A;text-transform:none;letter-spacing:0;margin-top:2px}
.gap{display:inline-block;font-size:11px;font-weight:600;color:#8A3B00;background:#FDE8D7;border-radius:4px;padding:1px 6px;text-transform:none;letter-spacing:0}
.ai{display:inline-block;font-size:11px;font-weight:600;color:#4B2C91;background:#ECE6FA;border-radius:4px;padding:1px 6px}
.tab{min-height:44px;padding:0 4px;margin-right:22px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-weight:500;color:#5F6873;cursor:pointer}
.tab.on{color:#1C2128;border-bottom-color:var(--accent)}
.optcard{display:flex;flex-direction:column;gap:8px;padding:20px;border:1px solid #DDE1E6;border-radius:12px;background:#fff;text-align:left;font:inherit;color:#1C2128;cursor:pointer}
.optcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.fld{padding:14px 18px;border-bottom:1px solid #EDF0F2}
.fld.l{border-right:1px solid #EDF0F2}.fld.full{grid-column:1/-1;border-right:0}
.stack{display:flex;flex-direction:column;gap:18px}
.row-flex{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.banner{padding:12px 16px;border-radius:10px;font-size:13px}
.b-warn{background:#FFF1D6;color:#5C3800}.b-err{background:#FBE3E0;color:#6E1A12}.b-gap{background:#FDE8D7;color:#6B2E00}.b-mute{background:#E7E9EC;color:#2F363E}
.toast{position:fixed;top:72px;right:24px;z-index:30;max-width:420px;padding:12px 16px;border-radius:10px;background:#1C2128;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(20,24,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:100px 16px;overflow:auto}
.bar{height:6px;background:#EDF0F2;border-radius:3px}.bar>div{height:6px;border-radius:3px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#D5DAE0;cursor:pointer}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.form2{grid-template-columns:1fr}.fld.l{border-right:0}nav{max-width:none}}
</style>

function vCatalog(){
  var q=S.query.trim().toLowerCase();
  var now=pd(TODAY);
  var age=function(r){return (now-pd(r.modified))/864e5;};
  var rows=S.reports.filter(function(r){
    var a=age(r),dOk=S.fDate==='any'||(S.fDate==='7'&&a<=7)||(S.fDate==='30'&&a<=30)||(S.fDate==='older'&&a>30);

  });
  var ORDER={'Draft':0,'In Review':1,'Published':2,'Archived':3};

    if(S.sort==='mod-asc')return pd(a.modified)-pd(b.modified);
    if(S.sort==='name')return a.name.localeCompare(b.name);
    if(S.sort==='status')return ORDER[a.status]-ORDER[b.status]||a.name.localeCompare(b.name);
    return pd(b.modified)-pd(a.modified);
  });
  var sel=function(field,cur,opts){return '<select class="inp" style="width:auto;min-width:150px" data-field="'+field+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';};

  }).join('');
  var sf=['All','Draft','In Review','Published','Archived'].map(function(s){return btn(s,s===S.fStatus?'fchip on':'fchip','fStatus',s);}).join('');

  var f=['All','Draft','In Review','Published','Archived'].map(function(s){return btn(s,s===S.kbF?'fchip on':'fchip','kbF',s);}).join('');
  var rows=S.kbs.filter(function(k){return S.kbF==='All'||k.status===S.kbF;}).map(function(k){
    return '<tr class="row" data-act="openKb" data-arg="'+k.id+'"><td><div style="font-weight:600">'+e(k.topic)+'</div>'+(kbWarn(k)?'<div style="font-size:12px;color:#8A3B00;margin-top:2px">Links an archived report</div>':'')+'</td><td>'+e(k.category||'—')+'</td><td>'+applies(k)+'</td><td><span class="'+stCls(k.status)+'">'+k.status+'</span></td><td><div>'+k.updated+'</div><div class="muted" style="font-size:12px">'+k.by+'</div></td></tr>';
  }).join('');
  return '<div class="stack"><div class="row-flex" style="align-items:flex-end"><div style="flex:1 1 320px"><h1>Knowledge Base</h1><p class="muted" style="margin:4px 0 0">FAQs, run instructions, report locations and troubleshooting: answers that report metadata alone can\'t give.</p></div>'+btn('New entry','btn btn-primary','newKb')+'</div>'+
  '<div class="card row-flex" style="padding:14px 16px;gap:6px"><span class="lbl">Status</span>'+f+'</div>'+
  '<div class="card scroll"><table class="tbl" style="min-width:900px"><thead><tr><th>Topic'+col('HELP_TOPIC.TOPIC')+'</th><th>Category'+(S.showSchema?'<span class="col">'+gapB()+'</span>':'')+'</th><th>Applies to'+col('LINKED_REPORTS_JSON')+'</th><th>Status'+col('STATUS')+'</th><th>Updated'+col('UPDATED_AT · USER_NAME')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function vKbDetail(){
  var k=kb(S.kid),acts='',edit=k.status==='Draft'||k.status==='In Review'||(k.status==='Published'&&k.workingDraft);
  var item=Object.assign({},k,{linkedText:applies(k)});
  if(k.status==='Draft') acts=btn('Archive','btn','modal','archive')+btn('Submit for review','btn btn-primary','setStatus','In Review');
  if(k.status==='In Review') acts=btn('Return to draft','btn','setStatus','Draft')+btn('Publish','btn btn-primary','modal','publish');
  if(k.status==='Published'&&!k.workingDraft) acts=btn('Unpublish','btn','modal','unpublish')+btn('Archive','btn','modal','archive')+btn('Edit as working draft','btn btn-primary','workingDraft','1');
  if(k.status==='Published'&&k.workingDraft) acts=btn('Discard draft','btn','workingDraft','0')+btn('Publish changes','btn btn-primary','modal','publish');
  var ktabs=[['content','Content'],['search','Search & index'],['history','History']].map(function(t){return btn(t[1],t[0]===S.kbTab?'tab on':'tab','kbTab',t[0]);}).join('');
  var pub=k.status==='Published',body='';
  if(S.kbTab==='content') body='<div class="card form2">'+fieldsHtml(item,K_DEFS,edit,'kb')+'</div>';
  if(S.kbTab==='search') body=(pub?'':'<div class="banner b-mute"><strong>Not indexed.</strong> Draft, In Review and Archived entries are never searchable by Report Concierge.</div>')+
    '<div class="grid4"><div class="card" style="padding:14px 16px"><div class="lbl">Search status</div><div class="'+(pub?'sr-ok':'sr-mute')+'" style="font-size:18px;margin-top:4px">'+(pub?'In sync':(k.status==='Archived'?'Removed':'Not indexed'))+'</div></div>'+
    '<div class="card" style="padding:14px 16px"><div class="lbl">Last rebuilt</div><div style="font-size:18px;font-weight:600;margin-top:4px">'+(pub?k.updated:'—')+'</div>'+col('REPORT_SEARCH_CHUNK.REBUILT_AT')+'</div>'+
    '<div class="card" style="padding:14px 16px"><div class="lbl">Search chunks</div><div style="font-size:18px;font-weight:600;margin-top:4px">'+(pub?2:0)+'</div>'+col('CHUNK.OWNER_TYPE = HELP_TOPIC')+'</div>'+
    '<div class="card" style="padding:14px 16px"><div class="lbl">Content type in index</div><div style="font-size:14px;font-weight:600;margin-top:6px">Knowledge Base</div>'+col('CHUNK.HELP_TOPIC_ID')+'</div></div>'+
    '<p class="muted" style="margin:0;font-size:13px">The index keeps the content type so Report Concierge can tell report metadata apart from supporting Knowledge Base answers (spec §14).</p>';
  if(S.kbTab==='history') body='<div class="card" style="padding:6px 0">'+(S.showSchema?'<div class="banner b-gap" style="margin:10px 18px"><strong>No audit table in the current schema.</strong> HELP_TOPIC only has CREATED_AT, UPDATED_AT and USER_NAME.</div>':'')+
    [[k.updated+' 10:02 AM',k.by,'Edited content'],['09/12/2026 3:30 PM','reviewer','Status In Review → Published · embeddings refreshed'],['09/12/2026 11:15 AM',k.by,'Created entry']].map(function(x){return '<div class="row-flex" style="gap:6px 16px;padding:12px 18px;border-bottom:1px solid #EDF0F2"><span class="mono muted" style="flex:0 0 150px;font-size:12px">'+x[0]+'</span><span style="flex:0 0 120px;font-weight:600">'+x[1]+'</span><span style="flex:1 1 280px">'+x[2]+'</span></div>';}).join('')+'</div>';
  if(k.status==='Archived') acts=btn('Restore as draft','btn btn-primary','setStatus','Draft');
  return '<div class="stack" style="gap:16px"><div>'+btn('← Knowledge Base','btn btn-ghost btn-sm','go','kb')+
  '<div class="row-flex" style="margin-top:4px"><div style="flex:1 1 320px;min-width:0"><div class="row-flex" style="gap:10px"><h1>'+e(k.topic)+'</h1><span class="'+stCls(k.status)+'">'+k.status+'</span></div><div class="muted mono" style="font-size:12px;margin-top:4px">'+k.id+' · updated '+k.updated+' by '+k.by+'</div></div><div class="row-flex" style="gap:8px">'+acts+'</div></div></div>'+
  (kbWarn(k)?'<div class="banner b-gap"><strong>This entry links an archived report.</strong> Unlink it or archive this entry too, or the assistant may point users to a retired report.</div>':'')+
  (pub&&k.workingDraft?'<div class="banner b-warn"><strong>Working draft.</strong> The published answer stays live in Report Concierge until these changes are published.</div>':'')+
  '<div role="tablist" style="display:flex;flex-wrap:wrap;border-bottom:1px solid #DDE1E6">'+ktabs+'</div>'+body+'</div>';
}

function vModal(){
  var m=S.modal; if(!m) return '';
  var item=m.kind==='report'?rep(S.rid):kb(S.kid),name=m.kind==='report'?item.name:item.topic;
  var title,intro,steps,label,warn='',miss=[];
  if(m.action==='publish'){
    title='Publish “'+name+'”';intro='Publishing is the approval boundary. Once confirmed, Report Concierge can return this content to users.';
    miss=m.kind==='report'?[['name','Display name'],['domain','Domain'],['desc','Description']].filter(function(x){return !item[x[0]];}).map(function(x){return x[1];}):[['topic','Topic'],['answer','Content']].filter(function(x){return !item[x[0]];}).map(function(x){return x[1];});
    steps=[['Validate required metadata',''],['Mark this version Published',m.kind==='report'?'APPROVED_TO_PUBLISH_IND = Y':'HELP_TOPIC.STATUS'],['Generate or refresh embeddings','REPORT_SEARCH_CHUNK_EMBEDDING'],['Update the search index','REPORT_SEARCH_DOCUMENT'],['Make available to Report Concierge',''],['Record the publication in audit history','(no table yet)']];label='Publish';
  }
  if(m.action==='unpublish'){title='Unpublish “'+name+'”';intro='Removes it from the assistant without deleting the record.';steps=[['Remove from conversational retrieval',''],['Deactivate vector-index entries','REPORT_SEARCH_CHUNK'],['Keep metadata and history',''],['Record in audit trail','(no table yet)']];label='Unpublish';}
  if(m.action==='archive'){
    title='Archive “'+name+'”';intro='Archive is the preferred way to retire content. It stays visible here for history.';
    if(m.kind==='report'){var n=S.kbs.filter(function(k){return k.linked.indexOf(item.id)>=0;}).length;if(n)warn=n+' Knowledge Base '+(n===1?'entry links':'entries link')+' this report. They will be flagged for review.';}
    steps=[['Keep metadata, version, audit and publication history',''],['Remove from Report Concierge retrieval','REPORT_SEARCH_*'],['Record who archived it and when','(no columns yet)']];label='Archive';
  }
  var blocked=miss.length>0;
  return '<div class="overlay"><div role="dialog" aria-modal="true" aria-label="'+e(title)+'" class="card" style="width:100%;max-width:560px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)"><h2 style="margin:0 0 6px;font-size:20px;font-weight:600">'+e(title)+'</h2><p class="muted" style="margin:0 0 16px">'+intro+'</p>'+
  (blocked?'<div class="banner b-err" style="margin-bottom:14px"><strong>Can\'t publish yet.</strong> Missing required: '+miss.join(', ')+'.</div>':'')+
  (warn?'<div class="banner b-warn" style="margin-bottom:14px">'+warn+'</div>':'')+
  '<ol style="margin:0 0 18px;padding-left:20px;display:flex;flex-direction:column;gap:6px">'+steps.map(function(s){return '<li>'+s[0]+(S.showSchema&&s[1]?' <span class="mono" style="font-size:11px;color:#6B5B9A">'+s[1]+'</span>':'')+'</li>';}).join('')+'</ol>'+
  '<div style="display:flex;justify-content:flex-end;gap:8px">'+btn('Cancel','btn','closeModal')+'<button class="btn btn-primary" data-act="confirm"'+(blocked?' disabled':'')+'>'+label+'</button></div></div></div>';
}

function render(){
  var a=document.activeElement,fid=a&&a.getAttribute&&a.getAttribute('data-field'),ss=a&&a.selectionStart,se=a&&a.selectionEnd;
  var v={catalog:vCatalog,add:vAdd,ai:vAi,detail:vDetail,kb:vKb,kbdetail:vKbDetail}[S.screen]();
  document.getElementById('app').innerHTML=vHeader()+'<div class="layout">'+vNav()+'<main>'+v+'</main></div>'+vModal()+(S.toast?'<div class="toast" role="status">'+e(S.toast)+'</div>':'');
  if(fid){var el=document.querySelector('[data-field="'+fid+'"]');if(el){el.focus();try{el.setSelectionRange(ss,se);}catch(x){}}}
}

function newReport(o){
  var id='R-10'+(80+S.reports.length);
  var r=Object.assign({id:id,code:'—',platform:'SAS',source:'SAS',program:'',status:'Draft',modified:TODAY,by:'you',published:'—',search:'Not indexed',rebuilt:'—',chunks:0,purpose:'',location:'',keywords:'',aliases:'',users:'',ai:false},o,{id:id});
  S.reports.unshift(r);S.screen='detail';S.rid=id;S.tab='overview';S.fStatus='All';
  toast('Draft created · not visible to Report Concierge until published');
}

var ACT={
  go:function(s){S.screen=s;S.modal=null;if(s==='ai'){S.aiAcc={};S.aiVals={};S.aiEdit=null;}render();},
  toggleSchema:function(){S.showSchema=!S.showSchema;render();},
  fStatus:function(s){S.fStatus=s;render();},
  tile:function(s){S.fStatus=(S.fStatus===s&&S.fSource==='All'&&S.fDate==='any'&&!S.query)?'All':s;S.fSource='All';S.fDate='any';S.query='';render();},
  clearFilters:function(){S.fStatus='All';S.fSource='All';S.fDate='any';S.query='';render();},
  aiEdit:function(k){S.aiEdit=S.aiEdit===k?null:k;if(S.aiEdit===null)S.aiAcc[k]=true;render();},
  bulkDrafts:function(){
    if(S.bulkDone){toast('Drafts already created from this batch');return;}
    S.bulkDone=true;
    S.reports.unshift({id:'R-1082',name:'COB Recovery Summary',code:'CLM_COB_RECOVERY.sas',platform:'SAS',source:'SAS',domain:'Claims',program:'Recovery',status:'Draft',modified:TODAY,by:'batch',published:'—',search:'Not indexed',rebuilt:'—',chunks:0,desc:'Coordination-of-benefits recoveries by carrier and month. Possible duplicate of R-1042.',purpose:'',location:'SAS EG › Claims › Recovery',keywords:'COB, recovery, other carrier',aliases:'',users:'',ai:true});
    S.reports.unshift({id:'R-1081',name:'Claim Denial Reasons',code:'CLM_DENIAL_REASONS.sas',platform:'SAS',source:'SAS',domain:'Claims',program:'Claims Ops',status:'Draft',modified:TODAY,by:'batch',published:'—',search:'Not indexed',rebuilt:'—',chunks:0,desc:'Denied claim lines by denial reason code, provider and line of business.',purpose:'',location:'SAS EG › Claims › Monthly',keywords:'denials, denial reasons, CARC',aliases:'',users:'',ai:true});
    S.screen='catalog';S.fStatus='Draft';S.fSource='All';S.fDate='any';S.query='';
    toast('2 drafts created from batch · each still needs review before publishing');
  },
  fSource:function(s){S.fSource=s;render();},
  kbF:function(s){S.kbF=s;render();},
  openReport:function(id){S.rid=id;S.tab='overview';S.screen='detail';render();},
  openKb:function(id){S.kid=id;S.kbTab='content';S.screen='kbdetail';render();},
  tab:function(t){S.tab=t;render();},
  addMode:function(m){S.addMode=m;render();},
  aiToggle:function(k){S.aiAcc[k]=!S.aiAcc[k];render();},
  saveAi:function(){var g=function(i){var k=AI_DEFS[i][0];return S.aiVals[k]!=null?S.aiVals[k]:AI_DEFS[i][2];};S.aiEdit=null;newReport({name:g(0),code:'PREAUTH_RENEWAL_TRACKING.sas',domain:g(6),program:'Clinical',desc:g(1),purpose:g(2),keywords:g(7),ai:true});},
  createManual:function(){
    if(!S.m.name){toast('Display name is required');return;}
    newReport({name:S.m.name,platform:S.m.platform||'—',source:'Manual',domain:S.m.domain,location:S.m.location,desc:S.m.desc});
    S.m={name:'',platform:'',domain:'',location:'',desc:''};
  },
  toast:function(m){toast(m);},
  setStatus:function(s){
    if(S.screen==='kbdetail'){var k=kb(S.kid);k.status=s;k.updated=TODAY;k.by='you';}
    else{var r=rep(S.rid);r.status=s;r.modified=TODAY;r.by='you';if(s!=='Published')r.search=r.status==='Draft'&&r.search==='Removed'?'Not indexed':r.search;if(s==='Draft'&&r.search==='Removed')r.search='Not indexed';}
    toast(s==='In Review'?'Submitted for review':(s==='Draft'?'Moved to Draft':'Status updated'));
  },
  kbTab:function(t){S.kbTab=t;render();},
  workingDraft:function(v){var r=S.screen==='kbdetail'?kb(S.kid):rep(S.rid);r.workingDraft=v==='1';toast(v==='1'?'Working draft created · published version still live':'Draft discarded');},
  reindex:function(){var r=rep(S.rid);r.search='In sync';r.rebuilt='10/28 9:12 AM';toast('Index rebuilt · database and search index back in sync');},
  modal:function(a){S.modal={kind:S.screen==='kbdetail'?'kb':'report',action:a};render();},
  closeModal:function(){S.modal=null;render();},
  newKb:function(){var id='HT-2'+(10+S.kbs.length);S.kbs.unshift({id:id,topic:'New entry',category:'',platform:'All',linked:[],status:'Draft',updated:TODAY,by:'you',summary:'',answer:'',aliases:'',related:'',override:'No'});S.kid=id;S.kbTab='content';S.screen='kbdetail';render();},
  confirm:function(){
    var m=S.modal,msg='';if(!m)return;
    if(m.kind==='report'){
      var r=rep(S.rid);r.modified=TODAY;r.by='you';r.workingDraft=false;
      if(m.action==='publish'){r.status='Published';r.published=TODAY;r.search='In sync';r.rebuilt='10/28 9:05 AM';r.chunks=13;msg='Published · embeddings rebuilt · now available to Report Concierge';}
      if(m.action==='unpublish'){r.status='Draft';r.search='Not indexed';msg='Unpublished · removed from conversational retrieval · history kept';}
      if(m.action==='archive'){r.status='Archived';r.search='Removed';msg='Archived · excluded from retrieval · history kept';}
    }else{
      var k=kb(S.kid);k.updated=TODAY;k.by='you';k.workingDraft=false;
      k.status={publish:'Published',unpublish:'Draft',archive:'Archived'}[m.action];
      msg={publish:'Published · embeddings refreshed',unpublish:'Unpublished · removed from retrieval',archive:'Archived · history kept'}[m.action];
    }
    S.modal=null;toast(msg);
  }
};

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t||t.disabled)return;
  var a=t.getAttribute('data-act');if(a==='toggleSchema'&&t.tagName==='INPUT'){ACT.toggleSchema();return;}
  if(ACT[a])ACT[a](t.getAttribute('data-arg'));
});
document.addEventListener('input',function(ev){
  var f=ev.target.getAttribute('data-field');if(!f)return;
  var v=ev.target.value;
  if(f==='query'){S.query=v;render();return;}
  if(f==='fDate'||f==='sort'){S[f]=v;render();return;}
  var p=f.split(':');
  if(p[0]==='m')S.m[p[1]]=v;
  if(p[0]==='report')rep(S.rid)[p[1]]=v;
  if(p[0]==='kb')kb(S.kid)[p[1]]=v;
  if(p[0]==='ai')S.aiVals[p[1]]=v;
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.modal){S.modal=null;render();}});
render();
})();
</script>
</body>
</html>
